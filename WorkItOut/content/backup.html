<!DOCTYPE html>
<html>

<head>
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#303030" />
    <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" type="text/css" href="../stylesheets/styles.css">
    <title>Work It Out | Backup</title>
</head>

<body>
    <div id="banner">
        <a id="banner_text_link" href="../content/home.html">Work It Out</a>
    </div>
    <div id="wrapper">
        <div>
            <h2>Backup</h2>
        </div>

        <div>
            <h3>Save a copy</h3>
            <p class="backup_blurb">
                Your workouts are stored only on this device. Export a file and keep
                it somewhere safe.
            </p>
            <button id="export_button" class="home_page_button">Export</button>
        </div>

        <hr>

        <div>
            <h3>Restore from a file</h3>
            <p class="backup_blurb">
                Anything with the same name is overwritten. Data not in the file is
                left alone.
            </p>
            <button id="import_button" class="home_page_button">Import</button>
            <!-- Hidden so the visible control can use the app's button styling;
                 #import_button forwards the click to it. -->
            <input id="import_file" type="file" accept="application/json,.json" style="display: none;" />
        </div>

        <div>
            <p id="backup_status"></p>
        </div>
    </div>

    <script src="../scripts/backup.js"></script>
</body>

<script src="../scripts/choose_bg_image.js"></script>
<script src="../scripts/navigation.js"></script>
<script src="../scripts/pwa.js"></script>
</html>
