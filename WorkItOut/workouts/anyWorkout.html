<!DOCTYPE html>
<html>

	<head>
        <link rel="manifest" href="../manifest.webmanifest" />
        <meta name="theme-color" content="#303030" />
        <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png" />
        <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="stylesheet" type="text/css" href="../stylesheets/styles.css">
		<title>Work It Out | Choose Workout</title>
	</head>

	<body>
		<div id="banner">
			<a id="banner_text_link" href="../content/home.html">Work It Out</a>
		</div>
		<div id="wrapper">
			<div>
				<img id="page_image" onclick="window.location.href='../content/workouts.html'"
					src="../images/work_it_out_logo_workouts.png" alt="Work It
					Out logo">
			</div>
			<div>
				<h1 id="any_workout_name">Workout Name</h1>
				<h3 id="any_workout_type">Workout Type</h3>
			</div>
			<button class="end_timer_button" id="start_button" style="margin-bottom: 1.5rem;" onclick="startTimer()">START</button>
			<button class="end_timer_button" id="history_toggle_button" style="margin-bottom: 1.5rem;" onclick="toggleWorkoutHistory()">VIEW HISTORY</button>
			<!-- Past sessions, newest first. Filled in by renderWorkoutHistory() each time it is opened. -->
			<div id="workout_history" hidden></div>
			<div id="any_workout_div">
				<table id="any_workout_table" class="new_workout_table">
					<tr id="any_workout_headers_1">
						<td class="new_workout_data new_workout_headers">Name</td>
						<td class="new_workout_data new_workout_headers">Wt.</td>
						<td class="new_workout_data new_workout_headers">S</td>
						<td class="new_workout_data new_workout_headers">R</td>
					</tr>
				</table>
			</div>
			<div id="any_workout_notes">
				<h3>NOTES</h3>
				<p id='notes_paragraph' contenteditable='true'></p>
			</div>
			<div id="end_timer">
				<button class="end_timer_button" id="end_timer_button" style="margin-top: 1.5rem;" onclick="displayWorkoutMinutesAndSave()">FINISH AND SAVE</button>
			</div>
		</div>
		<!-- <script src=""></script> -->
		<script src="../scripts/long_press.js"></script>
		<script src="../scripts/anyWorkout.js"></script>
	</body>

    <script src="../scripts/choose_bg_image.js"></script>
    <script src="../scripts/navigation.js"></script>
    <script src="../scripts/pwa.js"></script>
</html>
