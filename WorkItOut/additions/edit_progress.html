<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Work It Out | Track Progress</title>
    <link rel="stylesheet" type="text/css" href="../stylesheets/styles.css">
</head>

<body>

    <div id="banner">
        <!-- <img src="BackArrow.jpg" alt="The back button" /> -->
        <a id="banner_text_link" href="../content/home.html">Work It Out</a>
    </div>

    <div id="wrapper">
        <!-- No action/method: this form must never POST anywhere. It used to
             target http://tbd.com, a placeholder host that doesn't exist -
             inside an Android WebView that shows a connection-error page and
             drops the user out of the app. onsubmit returns false so Enter in a
             text field can't navigate either. Saving still needs a real handler
             (see #submit_button below). -->
        <form onsubmit="return false;">

            <div id="name_progress">
                <h1>Track Your Progress:</h1>
                <textarea rows="4" cols="45" placeholder="Type progress memo here..." required, autofocus></textarea>
            </div>

            <div id="add_progress_image">
                <h3>Add images:</h3>
                <input type="file" name="progress_imgs" accept="image/*" multiple />
                <br>
                <h3>Caption your photo:</h3>
                <input type="text" name="progress_caption" maxlength="75" placeholder="Caption your image...">
                <input type="date" name="progress_date">
            </div>
        </form>

        <div>
            <br>
            <button id="add_progress">Add Progress</button>
            <br>
        </div>

        <div class="cancel_submit">
            <button id="cancel_button" onclick="window.location.href='../content/home.html'">Cancel</button>
            <!-- TODO: this input sits outside </form> above, so it was never
                 associated with the form and clicking it has always done
                 nothing. Persisting a progress memo still needs a handler;
                 note the photo input means storage has to hold binary data,
                 which localStorage is a poor fit for. -->
            <input id="submit_button" type="submit" name="submit_new_progress">
        </div>
    </div>

</body>

<script src="../scripts/choose_bg_image.js"></script>
<script src="../scripts/navigation.js"></script>
</html>
