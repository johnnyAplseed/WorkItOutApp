<!DOCTYPE html>
<html>

<head>
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#303030" />
    <link rel="apple-touch-icon" href="../images/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Work It Out | Add Water</title>
    <link rel="stylesheet" type="text/css" href="../stylesheets/styles.css">
</head>

<body>

    <div id="banner">
        <!-- <img src="BackArrow.jpg" alt="The back button" /> -->
        <a id="banner_text_link" href="../content/home.html">Work It Out</a>
    </div>

    <div id="wrapper">
        <!-- No action/method: this form must never POST anywhere. It used to
             target http://tbd.com, a placeholder host that doesn't exist -
             inside an Android WebView that shows a connection-error page and
             drops the user out of the app. onsubmit returns false so Enter in a
             text field can't navigate either. Saving still needs a real handler
             (see #submit_button below). -->
        <form onsubmit="return false;">

            <div id="name_workout">
                <h3>Add a specific container:</h3>
                <input type="text" name="water_name" maxlength="40" placeholder="Frequent bottle name...">
                <h3>How many ounces the container holds:</h3>
                <input type="text" name="water_ounces" maxlength="40" placeholder="Number of ounces...">
            </div>

        </form>
        <hr>
        <div class="cancel_submit">
            <button id="cancel_button" onclick="window.location.href='../content/home.html'">Cancel</button>
            <!-- TODO: this input sits outside </form> above, so it was never
                 associated with the form and clicking it has always done
                 nothing. Persisting a named container still needs a handler
                 writing to storage, the way water_management.js tracks the
                 daily count. -->
            <input id="submit_button" type="submit" name="submit_new_exercise">
        </div>
    </div>

</body>

<script src="../scripts/choose_bg_image.js"></script>
<script src="../scripts/navigation.js"></script>
<script src="../scripts/pwa.js"></script>
</html>
